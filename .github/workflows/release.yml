name: Release

on:
  push:
    tags:
      - '*'
  # Builds the APK as a workflow artifact without publishing a release
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Build APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ github.ref_type == 'tag' && github.ref_name || '0.0.0-dev' }}
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Name APK
        env:
          VERSION_NAME: ${{ github.ref_name }}
        run: cp app/build/outputs/apk/release/app-release.apk "karoo-varia-${VERSION_NAME//\//-}.apk"

      - uses: actions/upload-artifact@v7
        if: github.ref_type != 'tag'
        with:
          name: apk
          path: karoo-varia-*.apk

      - name: Create release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" karoo-varia-*.apk --verify-tag --generate-notes
